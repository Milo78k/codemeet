enum InterviewStatus {
  DRAFT
  READY
  IN_PROGRESS
  FINISHED
}

enum ParticipantRole {
  INTERVIEWER
  CANDIDATE
}

enum QuestionDifficulty {
  EASY
  MEDIUM
  HARD
}

enum ProgrammingLanguage {
  JAVASCRIPT
  TYPESCRIPT
  REACT_TSX
}

enum CodeRunStatus {
  SUCCESS
  RUNTIME_ERROR
  TIMEOUT
}

enum InterviewTimelineEventType {
  INTERVIEW_STARTED
  QUESTION_CHANGED
  CANDIDATE_JOINED
  INTERVIEW_FINISHED
}

type User {
  id: ID!
  name: String!
  email: String!
  createdAt: String!
  updatedAt: String!
}

type Question {
  id: ID!
  title: String!
  description: String!
  difficulty: QuestionDifficulty!
  language: ProgrammingLanguage!
  starterCode: String!
  createdBy: User
  createdAt: String!
  updatedAt: String!
}

type InterviewQuestion {
  id: ID!
  order: Int!
  question: Question!
  snapshotTitle: String
  snapshotDescription: String
  snapshotDifficulty: QuestionDifficulty
  snapshotLanguage: ProgrammingLanguage
  snapshotStarterCode: String
  snapshotCapturedAt: String
}

type InterviewParticipant {
  id: ID!
  interviewId: ID!
  displayName: String!
  role: ParticipantRole!
  user: User
  joinedAt: String!
}

type Interview {
  id: ID!
  title: String!
  status: InterviewStatus!
  createdBy: User
  activeQuestion: Question
  questions: [InterviewQuestion!]!
  participants: [InterviewParticipant!]!
  startedAt: String
  finishedAt: String
  createdAt: String!
  updatedAt: String!
}

type CodeRun {
  id: ID!
  interviewId: ID!
  interviewQuestionId: ID!
  language: ProgrammingLanguage!
  sourceSnapshot: String!
  status: CodeRunStatus!
  stdout: String
  stderr: String
  durationMs: Int
  createdByParticipant: InterviewParticipant
  createdAt: String!
}

enum GuestInviteState {
  VALID
  EXPIRED
  USED
  INTERVIEW_FINISHED
  INVALID
}

type GuestInvitePreview {
  state: GuestInviteState!
  interviewTitle: String
  expiresAt: String
}

type GuestInvite {
  token: String!
  interviewId: ID!
  expiresAt: String!
}

type JoinInterviewPayload {
  interviewId: ID!
  participant: InterviewParticipant!
  participantSessionToken: String!
  participantSessionExpiresAt: String!
}

type PageInfo {
  limit: Int!
  offset: Int!
  totalCount: Int!
  hasNextPage: Boolean!
}

type QuestionPage {
  items: [Question!]!
  pageInfo: PageInfo!
}

type InterviewPage {
  items: [Interview!]!
  pageInfo: PageInfo!
}

type CodeRunPage {
  items: [CodeRun!]!
  pageInfo: PageInfo!
}

type InterviewResultsRun {
  id: ID!
  status: CodeRunStatus!
  sourceSnapshot: String!
  stdout: String!
  stderr: String!
  durationMs: Int
  createdAt: String!
}

type InterviewQuestionResult {
  interviewQuestionId: ID!
  order: Int!
  snapshotTitle: String
  snapshotLanguage: ProgrammingLanguage
  snapshotDifficulty: QuestionDifficulty
  runCount: Int!
  lastRun: InterviewResultsRun
}

type InterviewTimelineEvent {
  id: ID!
  type: InterviewTimelineEventType!
  createdAt: String!
  questionTitle: String
  previousQuestionTitle: String
  participantName: String
}

type InterviewResults {
  id: ID!
  title: String!
  status: InterviewStatus!
  available: Boolean!
  startedAt: String
  finishedAt: String
  durationMs: Int
  candidateName: String
  interviewerName: String!
  totalQuestions: Int!
  totalRuns: Int!
  questions: [InterviewQuestionResult!]!
  timeline: [InterviewTimelineEvent!]!
  hasMoreTimelineEvents: Boolean!
}

input CreateQuestionInput {
  title: String!
  description: String!
  difficulty: QuestionDifficulty!
  language: ProgrammingLanguage!
  starterCode: String!
}

input UpdateQuestionInput {
  title: String
  description: String
  difficulty: QuestionDifficulty
  language: ProgrammingLanguage
  starterCode: String
}

input CreateInterviewInput {
  title: String!
}

input RecordCodeRunInput {
  runId: ID!
  interviewQuestionId: ID!
  language: ProgrammingLanguage!
  sourceSnapshot: String!
  status: CodeRunStatus!
  stdout: String!
  stderr: String!
  durationMs: Int!
}

type Query {
  health: String!
  guestInvite(inviteToken: String!): GuestInvitePreview!
  currentParticipant: InterviewParticipant
  questions(
    search: String
    language: ProgrammingLanguage
    difficulty: QuestionDifficulty
    limit: Int = 20
    offset: Int = 0
  ): QuestionPage!
  question(id: ID!): Question
  interviews(status: InterviewStatus, limit: Int = 20, offset: Int = 0): InterviewPage!
  interview(id: ID!): Interview
  interviewResults(id: ID!): InterviewResults!
  codeRuns(
    interviewId: ID!
    interviewQuestionId: ID!
    limit: Int = 20
    offset: Int = 0
  ): CodeRunPage!
}

type Mutation {
  createGuestInvite(interviewId: ID!): GuestInvite!
  joinInterview(inviteToken: String!, displayName: String!): JoinInterviewPayload!
  createQuestion(input: CreateQuestionInput!): Question!
  updateQuestion(id: ID!, input: UpdateQuestionInput!): Question!
  createInterview(input: CreateInterviewInput!): Interview!
  addQuestionToInterview(interviewId: ID!, questionId: ID!, order: Int): Interview!
  setActiveQuestion(interviewId: ID!, questionId: ID!): Interview!
  startInterview(interviewId: ID!): Interview!
  finishInterview(interviewId: ID!): Interview!
  recordCodeRun(interviewId: ID!, input: RecordCodeRunInput!): CodeRun!
}
