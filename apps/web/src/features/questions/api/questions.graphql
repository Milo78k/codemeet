fragment QuestionFields on Question {
  id
  title
  description
  difficulty
  language
  starterCode
  createdAt
  updatedAt
  createdBy {
    id
    name
    email
  }
}

query GetQuestions(
  $search: String
  $language: ProgrammingLanguage
  $difficulty: QuestionDifficulty
  $limit: Int = 12
  $offset: Int = 0
) {
  questions(
    search: $search
    language: $language
    difficulty: $difficulty
    limit: $limit
    offset: $offset
  ) {
    items {
      ...QuestionFields
    }
    pageInfo {
      limit
      offset
      totalCount
      hasNextPage
    }
  }
}

query GetQuestion($id: ID!) {
  question(id: $id) {
    ...QuestionFields
  }
}

mutation CreateQuestion($input: CreateQuestionInput!) {
  createQuestion(input: $input) {
    ...QuestionFields
  }
}

mutation UpdateQuestion($id: ID!, $input: UpdateQuestionInput!) {
  updateQuestion(id: $id, input: $input) {
    ...QuestionFields
  }
}
